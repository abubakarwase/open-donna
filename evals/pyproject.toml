[project]
name = "opendonna-evals"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "duckdb",
  "jsonschema",
  "openpyxl",
  "psutil",
  "pytest",
  "pyyaml",
]

[project.scripts]
donna-evals = "donna_evals.cli:main"
donna-evals-validate = "donna_evals.validate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["donna_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
